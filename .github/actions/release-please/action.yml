name: Release please
description: 'A GitHub Action for automating releases using release-please'

inputs:
  GITHUB_TOKEN:
    description: 'GitHub token for authentication'
    required: true

outputs:
  pr-number:
    description: 'Release PR number'
    value: ${{ steps.set-pr.outputs.pr-number }}
  pr-created:
    description: 'Whether a release PR was created'
    value: ${{ steps.release-please.outputs.prs_created }}

runs:
  using: "composite"
  steps:
    - name: Release please
      id: release-please
      uses: googleapis/release-please-action@v4
      with:
        token: ${{ inputs.GITHUB_TOKEN }}
        release-type: simple
        
    - name: Set PR output
      id: set-pr
      run: echo "pr-number=${{ fromJson(steps.release-please.outputs.pr).number }}" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Set PR created output
      id: set-pr-created
      run: echo "prs_created=${{ steps.release-please.outputs.prs_created }}" >> "$GITHUB_OUTPUT"
      shell: bash